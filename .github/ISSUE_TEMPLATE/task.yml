name: 할 일
description: 개발 단계나 기능 하나
title: "[단계 N] "  # 문서 고치기는 [문서], 세팅은 [세팅]
body:
  - type: input
    id: refs
    attributes:
      label: 문서 번호
      description: docs의 FR, BR, AC, S-, dev-prompt 단계 번호
      placeholder: "단계 4, FR-010, S-03"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 할 일
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝났다고 보는 기준
      description: 돌려서 확인할 수 있는 것으로
    validations:
      required: true
