name: 할 일
description: 개발 단계나 기능 하나
title: "[T번호][단계 N] "  # T번호는 과제 체크리스트 번호(CONTRIBUTING 이슈). 문서 고치기는 [문서], 세팅은 [세팅]
body:
  - type: markdown
    attributes:
      value: "제목 앞 `[T번호]`는 팀 Hatch 과제 체크리스트 번호입니다 (Hatch가 이 번호로 이슈와 PR을 잇습니다). 번호 표는 [CONTRIBUTING.md 이슈](https://github.com/IKUZO-org/ikujo/blob/develop/CONTRIBUTING.md#이슈-작업은-반드시-이슈부터)"
  - type: input
    id: refs
    attributes:
      label: 문서 번호
      description: docs의 FR, BR, AC, S-, dev-prompt 단계 번호
      placeholder: "단계 4, FR-010, S-03"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 할 일
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 끝났다고 보는 기준
      description: 돌려서 확인할 수 있는 것으로
    validations:
      required: true
