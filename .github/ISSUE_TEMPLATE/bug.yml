name: 버그
description: 동작이 문서와 다르거나 깨짐
title: "[T번호][버그] "
body:
  - type: markdown
    attributes:
      value: "제목 앞 `[T번호]`는 팀 Hatch 과제 체크리스트 번호입니다 (Hatch가 이 번호로 이슈와 PR을 잇습니다). 번호 표는 [CONTRIBUTING.md 이슈](https://github.com/IKUZO-org/ikujo/blob/develop/CONTRIBUTING.md#이슈-작업은-반드시-이슈부터)"
  - type: textarea
    id: steps
    attributes:
      label: 다시 만드는 방법
      placeholder: "1. 방을 만든다 2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 것과 실제
    validations:
      required: true
  - type: markdown
    attributes:
      value: "키, 토큰, 개인정보를 붙이지 마세요. 공개 레포입니다."
